<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B1324">
<meta name="description" content="인액터스 YM 신입부원을 위한 2D 모험 게임. 동아리 박람회에서 시작해 원주를 걸어 다니며 인액터스를 배워요.">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#0B1324;color-scheme:light}[hidden]{display:none!important}</style>
<title>YM 첫 발자국</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: a magazine column (max 640px) holding a pixel-art canvas of Wonju; the HUD sits above it, touch controls over it,
   and every conversation opens as an ivory paper panel over the world. Yellow #FFC222 only for post-its, markers and the primary control. */
:root{
  --bg:#F3EEE2; --paper:#FCFAF4; --fg:#15223B; --muted:#5E6779; --line:#DAD1BC; --soft:#ECE5D2;
  --yellow:#FFC222; --on-yellow:#15223B; --navy:#15223B; --on-navy:#F3EEE2;
  --btn:#15223B; --on-btn:#F6F1E6; --label:#15223B;
  --good:#2B7A57; --good-bg:#E3EFE8; --bad:#B4432F; --bad-bg:#F5E2DC;
  --shadow:0 12px 32px rgba(21,34,59,.14);
  --serif:"EB Garamond","Times New Roman",Georgia,serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hand:"Nanum Pen Script","Noto Sans KR",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1729; --paper:#162540; --fg:#F2EDE1; --muted:#A9B2C4; --line:#2B3C5A; --soft:#1E3050;
    --navy:#0A1324; --on-navy:#F2EDE1; --btn:#FFC222; --on-btn:#15223B; --label:#FFC222;
    --good:#86D4AD; --good-bg:#1B3A2E; --bad:#F2A08C; --bad-bg:#47251E;
    --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1729; --paper:#162540; --fg:#F2EDE1; --muted:#A9B2C4; --line:#2B3C5A; --soft:#1E3050;
  --navy:#0A1324; --on-navy:#F2EDE1; --btn:#FFC222; --on-btn:#15223B; --label:#FFC222;
  --good:#86D4AD; --good-bg:#1B3A2E; --bad:#F2A08C; --bad-bg:#47251E;
  --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B1324;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0B1324}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
th{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
tr:first-child td,tr:first-child th{border-top:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.tbl table{min-width:380px}
.tbl.narrow table{min-width:0}

/* full-screen game */
.game{position:relative;width:100%;height:100%;background:#0B1324;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}
.game canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-weight:700;line-height:1.2;will-change:transform}
.lbl.nm{font-size:11px;color:#F3EEE2;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.6)}
.lbl.sign{font-size:11px;color:#F3EEE2;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.7)}
.lbl.tip{font-size:13px;color:#15223B;background:#FFC222;padding:4px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
@media (min-width:900px){.lbl.nm,.lbl.sign{font-size:13px}.lbl.tip{font-size:15px}}

/* HUD over the world */
.hud{position:absolute;left:0;right:0;top:0;z-index:3;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;background:linear-gradient(rgba(11,19,36,.88),rgba(11,19,36,.55) 70%,rgba(11,19,36,0));color:#F3EEE2;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.hud > *{pointer-events:auto}
.hudrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hudrow.sub{align-items:flex-start}
.hud .brand{font-family:var(--serif);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600;white-space:nowrap}
.pins{display:flex;gap:4px}
.pin{width:20px;height:20px;background:var(--yellow);color:var(--on-yellow);font-family:var(--hand);font-size:17px;line-height:20px;text-align:center;transform:rotate(-4deg);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.pin:nth-child(even){transform:rotate(3deg)}
.pin.off{background:rgba(243,238,226,.25);color:rgba(243,238,226,.7);box-shadow:none}
.tools{display:flex;gap:6px;margin-left:auto}
.hb{appearance:none;border:1px solid rgba(243,238,226,.45);background:rgba(11,19,36,.55);color:#F3EEE2;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.hb:active{background:#FFC222;color:#15223B}
.hb{position:relative}
.badge{position:absolute;top:-7px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#FFC222;color:#15223B;font-size:11px;font-weight:900;line-height:18px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4);animation:badgepop .5s ease}
@keyframes badgepop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.obj{display:flex;gap:8px;align-items:flex-start;background:rgba(252,250,244,.94);color:#15223B;border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.4;max-width:min(100%,520px);min-width:0}
.obj b{color:#15223B;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-top:2px}
.obj span{min-width:0}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:rgba(252,250,244,.94);color:#15223B;border-radius:10px;padding:4px 9px;display:flex;flex-direction:column;gap:3px;min-width:88px}
.stat .t{font-size:10px;color:#5E6779;display:flex;justify-content:space-between;gap:6px}
.stat .bar{height:4px;background:#DAD1BC;border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--yellow);transition:width .5s ease}
.stat .v{font-weight:700;font-variant-numeric:tabular-nums;color:#15223B}

.pad{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px;z-index:3}
.pad button{appearance:none;border:0;border-radius:10px;background:rgba(252,250,244,.78);color:#15223B;font-size:18px;font-weight:900;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pad button:active,.pad button.on{background:#FFC222}
.pad .e{visibility:hidden}
.abtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:0;background:#FFC222;color:#15223B;font-weight:900;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:3;touch-action:none}
.abtn:active{transform:scale(.95)}
@media (pointer:fine){.pad,.abtn{display:none}}
.toast{position:absolute;left:50%;bottom:max(96px,calc(env(safe-area-inset-bottom,0px) + 96px));transform:translateX(-50%);background:rgba(21,34,59,.92);color:#F3EEE2;padding:8px 14px;border-radius:999px;font-size:13px;z-index:4;max-width:92%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
@media (pointer:fine){.toast{bottom:28px}}
.toast.show{opacity:1}

/* overlay */
.ov{position:absolute;inset:0;z-index:5;background:rgba(8,16,32,.62);display:flex;align-items:flex-end;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none}
@media (min-width:700px){.ov{align-items:center}}
.panel{background:var(--paper);color:var(--fg);border-radius:14px;width:100%;max-width:640px;max-height:100%;overflow:auto;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.who{display:flex;align-items:center;gap:10px}
.who .face{width:36px;height:36px;border-radius:8px;background:var(--soft);image-rendering:pixelated;flex:0 0 auto}
.who .nm{font-weight:900;font-size:14px}
.who .rl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.say{font-size:16px;line-height:1.6}
.lab{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.lab::before{content:"";width:0;height:0;border-left:7px solid var(--yellow);border-top:5px solid transparent;border-bottom:5px solid transparent}
.h3{font-weight:700;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.quote{font-family:var(--serif);font-size:20px;line-height:1.3;font-style:italic;font-weight:500}
.quote span{display:block;font-family:var(--sans);font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.hand{font-family:var(--hand);font-size:26px;line-height:1.15}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.num{font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;background:var(--btn);color:var(--on-btn);display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{appearance:none;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;line-height:1.45;font-size:14px}
.choice:hover:not([disabled]){border-color:var(--fg)}
.choice[disabled]{cursor:default}
.choice .k{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.choice.ok{border-color:var(--good);background:var(--good-bg)}
.choice.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.choice.no{border-color:var(--bad);background:var(--bad-bg)}
.choice.no .k{background:var(--bad);border-color:var(--bad);color:#fff}
.choice.pick{border-color:var(--fg);background:var(--soft)}
.choice.pick .k{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.choice.dim{opacity:.55}
.fb{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.fb .head{display:flex;align-items:center;gap:10px;font-weight:700}
.fb.good .verdict{color:var(--good)}
.fb.bad .verdict{color:var(--bad)}
.fb .tbl{background:var(--paper)}
.postit{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--yellow);color:var(--on-yellow);font-family:var(--hand);font-size:26px;line-height:1;transform:rotate(-3deg);box-shadow:0 3px 8px rgba(21,34,59,.2);flex:0 0 auto}
.postit.lg{width:96px;height:96px;font-size:72px}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.delta{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:13px}
.chip[disabled]{opacity:.35;cursor:default}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:9px;padding:7px 10px;min-height:40px;font-size:13.5px}
.slot .n{font-family:var(--serif);font-size:16px;color:var(--muted);width:18px;flex:0 0 auto}
.slot.filled{border-style:solid;background:var(--paper)}
.slot.ok{border-color:var(--good);background:var(--good-bg)}
.slot.no{border-color:var(--bad);background:var(--bad-bg)}
.slot .ans{margin-left:auto;font-size:11px;color:var(--muted);text-align:right}
.match{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.25fr);gap:8px;align-items:start}
.match .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.mi{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.4;min-height:42px}
.mi.sel{border-color:var(--fg);background:var(--soft)}
.mi.done{border-color:var(--good);background:var(--good-bg);cursor:default}
.mi.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pipe{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;font-weight:700}
.pipe span{padding:5px 8px;border-radius:7px;background:var(--paper);border:1px solid var(--line)}
.pipe span.on{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.pipe i{color:var(--muted);font-style:normal}
.panel .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.panel .stat{background:var(--paper);color:var(--fg);border:1px solid var(--line);min-width:0}
.panel .stat .t{color:var(--muted);font-size:11px}
.panel .stat .v{color:var(--fg)}
.panel .stat .bar{background:var(--line)}
.grade{display:flex;gap:14px;align-items:center}
.grade .big{font-family:var(--serif);font-size:50px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check .m{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--muted)}
.check.on .m{background:var(--good);color:#fff}
.qs{display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.navy{background:var(--navy);color:var(--on-navy);border-color:transparent}
.card.navy .lab{color:var(--yellow)}
.card.navy .muted{color:#B9C2D4}
.band{background:var(--yellow);color:var(--on-yellow);padding:8px 14px;display:flex;justify-content:space-between;font-family:var(--serif);letter-spacing:.16em;text-transform:uppercase;font-size:11px;font-weight:600}
.cover{border-radius:12px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.cover .body{padding:22px 18px;display:flex;flex-direction:column;gap:12px}
.h-en{font-family:var(--serif);text-transform:uppercase;letter-spacing:.06em;font-weight:500;font-size:clamp(30px,8vw,44px);line-height:1.05}
.cover input{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);width:100%}
.cover label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.mini{width:100%;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.memark{position:absolute;width:0;height:0}
.memark i{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:2px solid #FFC222;animation:mepulse 1.4s ease-out infinite}
.memark b{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#FFC222;border:3px solid #15223B;box-shadow:0 0 0 2px #F3EEE2}
.memark span{position:absolute;left:10px;top:-9px;font-size:11px;font-weight:900;color:#15223B;background:#FFC222;padding:1px 6px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap}
@keyframes mepulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.qi .pin{flex:0 0 auto}
.panel .pin.off{background:var(--soft);color:var(--muted)}
.panel .obj{background:var(--soft);color:var(--fg);font-size:14px;max-width:none}
.panel .obj b{color:var(--label)}
.photo{width:100%;max-height:150px;object-fit:cover;border-radius:10px;display:block}
.ending3d{position:absolute;inset:0;z-index:6;background:#0B1324;overflow:hidden}
.ending3d canvas{display:block;width:100%;height:100%}
.endcap{position:absolute;left:0;right:0;bottom:max(70px,calc(env(safe-area-inset-bottom,0px) + 70px));text-align:center;color:#F3EEE2;font-weight:700;font-size:clamp(17px,4.2vw,26px);text-shadow:0 2px 10px rgba(0,0,0,.7);padding:0 24px;opacity:0;transition:opacity .5s;pointer-events:none}
.endcap.show{opacity:1}
.endcap small{display:block;font-size:.6em;font-weight:500;opacity:.8;margin-top:4px;letter-spacing:.1em}
.endcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);background:#F3EEE2;color:#15223B;border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fadein .6s}
.endcard .body{padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:center}
.endcard .btn{background:#15223B;color:#F6F1E6}
.endcard .btn.ghost{background:transparent;color:#15223B;border-color:#DAD1BC}
@keyframes fadein{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.endclose{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:2}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.match{gap:6px}.mi{font-size:12px;padding:7px 8px;min-height:40px;line-height:1.35}}

/* ---- v3: travel fade, banners, on-screen stats, carried bubble, pickup card, post-its, mini-game ---- */
.fade{position:absolute;inset:0;background:#0B1324;opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
.fade.on{opacity:1;pointer-events:auto}
.lbl.bn{font-size:10px;color:#15223B;letter-spacing:.14em;font-family:var(--serif);font-weight:600}
@media (min-width:900px){.lbl.bn{font-size:14px}}
button.pins{appearance:none;border:0;background:transparent;padding:2px;margin:0;cursor:pointer}
.statw{appearance:none;text-align:left;background:rgba(11,19,36,.74);border:1px solid rgba(243,238,226,.28);border-radius:10px;padding:6px 10px 7px;display:flex;flex-direction:column;gap:3px;color:#F3EEE2;width:168px;flex:0 0 auto}
.statw .st-h{font-size:10px;letter-spacing:.06em;color:#B9C2D4;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.statw .st-h i{font-style:normal;opacity:.8}
.statw .st-r{display:grid;grid-template-columns:38px 1fr 26px;align-items:center;gap:6px;font-size:11px;font-weight:700;position:relative}
.statw .st-r b{font-weight:700}
.statw .st-bar{height:6px;background:rgba(243,238,226,.2);border-radius:3px;overflow:hidden}

const MAPS={};
function makeMap(id,name,w,h,fill){
  const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill(fill));
  const m={id,name,w,h,g,ents:[],esol:{},labels:[]};MAPS[id]=m;
  m.set=(x,y,c)=>{if(x>=0&&y>=0&&x<w&&y<h)g[y][x]=c;};
  m.rect=(c,x,y,ww,hh)=>{for(let j=y;j<y+hh;j++)for(let i=x;i<x+ww;i++)m.set(i,j,c);};
  m.line=(c,x1,y1,x2,y2)=>{for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)m.set(x,y,c);};
  m.room=(x,y,ww,hh,doors,floor)=>{m.rect('w',x,y,ww,hh);m.rect(floor||'i',x+1,y+1,ww-2,hh-2);doors.forEach(d=>m.set(d[0],d[1],'x'));};
  return m;
}

let state=null;
function fresh(){return {v:3,name:'',started:false,map:'wonju',x:50*T,y:12*T,dir:'u',parts:{},ch:{},miss:{},sim:{stage:0,trust:40,sustain:40,energy:60,problem:null,best:{}},posters:[],delivered:{},btried:{},carrying:null,feet:[],nc:{met:false,q:{},perfect:false},flags:{}};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&s.v===3&&MAPS[s.map])return s;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function recalc(){CH.forEach(c=>{let sc=0,all=true;c.parts.forEach(k=>{const p=state.parts[k];if(p)sc+=p.p;else all=false;});state.ch[c.id]={score:Math.min(sc,c.max),max:c.max,done:all};});}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function josa(name,a,b){if(!name)return a;const c=name[name.length-1].charCodeAt(0);if(c<0xAC00||c>0xD7A3)return a+'('+b+')';return (c-0xAC00)%28?a:b;}
function fill(t){const p=state.sim.problem?PROBLEMS[state.sim.problem]:null;return t.replace(/\{who\}/g,p?p.who:'대상자').replace(/\{place\}/g,p?p.place:'현장');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function totalScore(){return CH.reduce((a,c)=>a+(state.ch[c.id]?state.ch[c.id].score:0),0);}
function chDone(id){return !!(state.ch[id]&&state.ch[id].done);}
function allDone(){return CH.every(c=>chDone(c.id));}
function freeRoam(){return state.sim.stage>=10;}
function chUnlocked(id){if(id==='three')return true;if(id==='what')return chDone('three');if(id==='year')return chDone('what');return freeRoam();}
function postersActive(){return freeRoam()&&!state.parts['rhythm.order'];}
function feetActive(){return !!state.flags.reported&&state.feet.length<5;}
function hiddenReady(){return state.feet.length>=5;}
function judgesLeft(){return [1,2,3].filter(j=>!state.nc.q[j]).length;}
function M(){return MAPS[state.map];}
function isPlane(e){return e.map==='wonju'&&!!(state&&state.flags.ncWon);}

function addPart(key,p,m){

function newFor(e){
  if(!state||!state.started)return null;
  const st=state.sim.stage,P=state.parts;
  switch(e.key){
    case 'booth':return (!chDone('three')&&state.carrying!==null)?'!':null;
    case 'bus':
      if(isPlane(e))return (e.kind==='bus'&&planeReady()&&!state.flags.endingSeen)?'!':null;   /* the plane itself, not the pilot */
      if(e.kind!=='npc')return null;
      if(e.map==='wonju')return ((chDone('three')&&!chDone('what'))||hiddenReady())?'!':null;
      if(e.map==='sc')return chDone('what')?'!':null;
      return (state.flags.ncWon&&!planeReady())?'!':null;
    case 'alum':return P['what.def']?null:'!';
    case 'ob':return P['what.word']?null:'!';
    case 'pres':return (st===1||st===6||(state.flags.ncWon&&!planeReady()))?'!':null;
    case 'field':return st===2?'!':null;
    case 'whiteboard':return (st===3||st===4)?'!':null;
    case 'mentor':return st===5?'!':null;
    case 'treasurer':return st===7?'!':null;
    case 'pr':return st===8?'!':null;
    case 'postwall':return st===9?'!':(allDone()&&!state.flags.reported?'!':null);
    case 'owner':return freeRoam()&&!P['community.roles']?'!':null;
    case 'phyco':return freeRoam()&&!P['community.phyco']?'!':null;
    case 'jeje':return freeRoam()&&!P['community.jeje']?'!':null;
    case 'shop':return freeRoam()&&!P['venture.'+e.v]?'!':null;
    case 'pboard':return freeRoam()&&[1,2,3,4,5].every(n=>P['venture.'+n])&&!P['venture.pipe']?'!':null;
    case 'bboard':return freeRoam()&&state.posters.length===5&&!P['rhythm.order']?'!':null;
    case 'nchost':return (!state.nc.met||(state.nc.perfect&&!state.flags.ncWon)||(state.flags.ncWon&&!planeReady()))?'!':null;
    case 'judge':return state.nc.met&&!state.nc.q[e.j]?'!':null;
    case 'podium':return state.nc.met&&!judgesLeft()&&!state.nc.perfect?'!':null;
  }
  return null;
}

function endClose(){if(!END)return;cancelAnimationFrame(END.raf);try{if(END.renderer)END.renderer.dispose();}catch(e){}END.box.remove();END=null;hud();afterClose();}
function startEnding(box){
  const cv3=box.querySelector('canvas'),cap=box.querySelector('.endcap');
  const renderer=new THREE.WebGLRenderer({canvas:cv3,antialias:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x0B1324);
  const camera=new THREE.PerspectiveCamera(40,1,0.01,50);
  const ll=(lat,lon,r)=>{const la=lat*Math.PI/180,lo=lon*Math.PI/180;return new THREE.Vector3(r*Math.cos(la)*Math.sin(lo),r*Math.sin(la),r*Math.cos(la)*Math.cos(lo));};
  const globe=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),new THREE.MeshPhongMaterial({color:0x14223C,shininess:6}));scene.add(globe);
  scene.add(new THREE.AmbientLight(0xffffff,0.6));const dl=new THREE.DirectionalLight(0xFFF1D0,0.75);dl.position.set(2,1.6,2.2);scene.add(dl);
  const mkPts=(str,r)=>{const a=str.split(',').map(Number);const arr=[];for(let i=0;i<a.length;i+=2){const v=ll(a[i+1]/10,a[i]/10,r);arr.push(v.x,v.y,v.z);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));return g;};
  scene.add(new THREE.Points(mkPts(GEO_WORLD,1.004),new THREE.PointsMaterial({color:0xE8E2D2,size:2.6,sizeAttenuation:false,transparent:true,opacity:0.8})));
  scene.add(new THREE.Points(mkPts(GEO_KR,1.005),new THREE.PointsMaterial({color:0xFFC222,size:2.8,sizeAttenuation:false,transparent:true,opacity:0.95})));
  const P0=ll(WONJU[0],WONJU[1],1.006);const pin=new THREE.Mesh(new THREE.SphereGeometry(0.0025,16,12),new THREE.MeshBasicMaterial({color:0xFFC222}));pin.position.copy(P0);scene.add(pin);
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.004,0.0055,32),new THREE.MeshBasicMaterial({color:0xFFC222,transparent:true,opacity:0.8,side:THREE.DoubleSide}));ring.position.copy(P0);ring.lookAt(P0.clone().multiplyScalar(2));scene.add(ring);
  const arcs=[];const mkArc=(a,b,color,opacity,t0,dur)=>{const A=ll(a[0],a[1],1.004),B=ll(b[0],b[1],1.004);const ang=A.angleTo(B);const Mid=A.clone().add(B).normalize().multiplyScalar(1+0.05+0.5*ang/Math.PI);const pts=new THREE.QuadraticBezierCurve3(A,Mid,B).getPoints(48);const g=new THREE.BufferGeometry().setFromPoints(pts);g.setDrawRange(0,0);const line=new THREE.Line(g,new THREE.LineBasicMaterial({color,transparent:true,opacity}));scene.add(line);const dot=new THREE.Mesh(new THREE.SphereGeometry(0.0018,8,6),new THREE.MeshBasicMaterial({color}));dot.position.copy(B);dot.visible=false;scene.add(dot);arcs.push({g,dot,t0,dur,n:49});};
  KR_CITIES.forEach((c,i)=>mkArc(WONJU,c,0xFFC222,0.95,1.3+i*0.07,0.9));
  WORLD_CITIES.forEach((c,i)=>mkArc(WONJU,c,0xF3EEE2,0.5,5.2+i*0.05,1.5));
  /* the plane and its yellow trail */
  const fpts=FLIGHT.map((p,i)=>{const u=i/(FLIGHT.length-1);return ll(p[0],p[1],1.02+0.07*Math.sin(Math.PI*Math.min(1,u*1.15)));});
  const curve=new THREE.CatmullRomCurve3(fpts);const TRAIL=160;const tg=new THREE.BufferGeometry().setFromPoints(curve.getPoints(TRAIL));tg.setDrawRange(0,0);
  scene.add(new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xFFC222,transparent:true,opacity:0.9})));
  const plane=new THREE.Group();const pm=new THREE.MeshBasicMaterial({color:0xF3EEE2}),ym=new THREE.MeshBasicMaterial({color:0xFFC222});
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.006,0.045,10),pm);body.rotation.x=Math.PI/2;plane.add(body);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.002,0.012),pm);plane.add(wing);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(0.018,0.002,0.008),ym);tail.position.z=-0.019;plane.add(tail);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(0.002,0.012,0.008),ym);fin.position.set(0,0.006,-0.019);plane.add(fin);
  plane.visible=false;scene.add(plane);
  const F0=5.6,F1=10.4;
  const ease=x=>x<0?0:x>1?1:(x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2);
  const D2=()=>(camera.aspect<1?4.3:3.2);const camAt=t=>{if(t<4.6)return [36.5,128,1.32];if(t<8.6){const k=ease((t-4.6)/4);return [36.5+(20-36.5)*k,128+(60-128)*k,1.32+(D2()-1.32)*k];}return [20,60-(t-8.6)*8,D2()];};
  const caps=[[0,'원주, 연세대 미래캠퍼스','NATIONAL CHAMPION · ENACTUS YM'],[1.3,'전국 26개 대학을 대표해서','ENACTUS KOREA'],[5.2,'36개국 챔피언이 모이는 무대로','ENACTUS WORLD CUP'],[8.7,'다음 발자국은, 세계','WONJU → THE WORLD']];
  let capI=-1,card=false;const start=performance.now();END.renderer=renderer;sfx('ending');
  const resize=()=>{const w=box.clientWidth||320,hh=box.clientHeight||240;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();};resize();
  const nm=state.name||'OOO';
  const tick=()=>{if(!END)return;const t=(performance.now()-start)/1000;
    const [la,lo,d]=camAt(t);camera.position.copy(ll(la,lo,d));camera.lookAt(0,0,0);
    const kk=(d-1)/0.32;pin.scale.setScalar(kk);const s=kk*(1+0.35*Math.abs(Math.sin(t*3)));ring.scale.set(s,s,s);ring.material.opacity=0.9-0.5*Math.abs(Math.sin(t*3));
    arcs.forEach(a=>{const k=ease((t-a.t0)/a.dur);a.g.setDrawRange(0,Math.floor(k*a.n));if(k>=1){a.dot.visible=true;a.dot.scale.setScalar(kk);}});
    if(t>=F0){const u=Math.min(1,(t-F0)/(F1-F0)),ue=ease(u);const p=curve.getPointAt(Math.min(0.999,ue)),q=curve.getPointAt(Math.min(1,ue+0.001));plane.visible=u<1;plane.position.copy(p);plane.up.copy(p).normalize();plane.lookAt(q);plane.scale.setScalar(Math.max(1,d*0.85));tg.setDrawRange(0,Math.floor(ue*TRAIL)+1);}
    let ci=-1;caps.forEach((c,i)=>{if(t>=c[0])ci=i;});if(ci!==capI){capI=ci;cap.classList.remove('show');setTimeout(()=>{if(!END||card)return;cap.innerHTML=esc(caps[ci][1])+'<small>'+esc(caps[ci][2])+'</small>';cap.classList.add('show');},180);}
    if(t>=10.8&&!card){card=true;cap.classList.remove('show');const ec=document.createElement('div');ec.className='endcard';ec.innerHTML=`<div class="band"><span>World Cup Bound</span><span>Enactus YM</span></div><div class="body"><div class="hand" style="font-size:30px">네 옆자리 ${esc(nm)}${josa(state.name,'이','가')} 세상을 바꾼다</div><div class="h-en" style="font-size:28px">Enactus YM</div><p>원주에서 전국 26개 대학으로, 세계 36개국의 무대로</p><p class="small" style="color:#5E6779">A head for business. A heart for the world.</p><p class="small" style="color:#5E6779">히든 엔딩 · 진짜 발자국은 지금부터.</p><div class="row" style="justify-content:center;margin-top:6px"><button class="btn" id="endAgain">다시 보기</button><button class="btn ghost" id="endDone">닫기</button></div></div>`;box.appendChild(ec);ec.querySelector('#endDone').addEventListener('click',endClose);ec.querySelector('#endAgain').addEventListener('click',()=>{endClose();ending();});sfx('done');if(!state.flags.endingSeen){state.flags.endingSeen=true;save();}}
    if(Math.abs(box.clientWidth-renderer.domElement.width/renderer.getPixelRatio())>2)resize();
    renderer.render(scene,camera);END.raf=requestAnimationFrame(tick);};
  tick();
}

  recalc();hud();requestAnimationFrame(loop);
  if(!state.started)cover();else if(!state.flags.opened)opening();
}
